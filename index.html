<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Open World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none;
    font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  #joystick {
    position: fixed;
    left: 28px; bottom: 32px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(2px);
    z-index: 10;
  }
  #stick {
    position: absolute;
    left: 50%; top: 50%;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.5);
    transform: translate(-50%,-50%);
  }

  .roundBtn {
    position: fixed;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.9);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .roundBtn:active { background: rgba(255,255,255,0.25); }

  #jumpBtn {
    right: 30px; bottom: 46px;
    width: 74px; height: 74px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  #actionBtn {
    right: 116px; bottom: 76px;
    width: 64px; height: 64px;
    font-size: 26px;
    display: none;
  }
  #actionBtn.visible { display: flex; }
  #craftBtn {
    right: 34px; bottom: 136px;
    width: 56px; height: 56px;
    font-size: 24px;
  }

  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 16px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    line-height: 1.6;
    z-index: 10;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #clockHud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 64px;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    z-index: 10;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  #settingsBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    right: 12px;
    width: 40px; height: 40px;
    font-size: 20px;
  }
  .panel {
    position: fixed;
    background: rgba(20,25,35,0.94);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 14px;
    z-index: 20;
    color: #eee;
    font-size: 14px;
    display: none;
  }
  .panel.open { display: block; }
  .panel h3 { font-size: 13px; opacity: 0.6; margin-bottom: 10px; font-weight: 600; }
  #settings {
    top: calc(env(safe-area-inset-top, 0px) + 54px);
    right: 12px;
    min-width: 210px;
  }
  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .segmented {
    display: flex;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    overflow: hidden;
  }
  .segmented button {
    background: transparent;
    border: none;
    color: #ccc;
    padding: 7px 12px;
    font-size: 13px;
  }
  .segmented button.active { background: rgba(255,255,255,0.22); color: #fff; }

  #craftPanel {
    left: 50%; bottom: 110px;
    transform: translateX(-50%);
    width: min(340px, calc(100vw - 32px));
    max-height: 55vh;
    overflow-y: auto;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .recipe {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 8px;
    border-radius: 8px;
    margin-bottom: 2px;
    cursor: pointer;
  }
  .recipe:hover { background: rgba(255,255,255,0.08); }
  .recipe:active { background: rgba(255,255,255,0.14); }
  .recipe.disabled { opacity: 0.4; pointer-events: none; }
  .recipe .cost { font-size: 13px; opacity: 0.8; }
  .recipe .key {
    display: inline-block;
    min-width: 20px;
    text-align: center;
    font-size: 11px;
    opacity: 0.55;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    padding: 1px 3px;
    margin-right: 8px;
  }

  #placeControls {
    position: fixed;
    left: 50%; bottom: 150px;
    transform: translateX(-50%);
    display: none;
    gap: 20px;
    z-index: 15;
  }
  #placeControls.visible { display: flex; }
  #placeControls button {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    font-size: 24px;
    color: #fff;
  }
  #placeOk { background: rgba(60,160,80,0.75); }
  #placeOk:disabled { background: rgba(120,120,120,0.5); opacity: 0.6; }
  #placeCancel { background: rgba(180,60,60,0.75); }

  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    z-index: 9;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    left: 50%; bottom: 170px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    background: rgba(0,0,0,0.35);
    padding: 6px 14px;
    border-radius: 20px;
    z-index: 9;
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }
  #hint.visible { display: block; }
</style>
</head>
<body>
<div id="game"></div>
<div id="crosshair"></div>
<div id="hud">🪵 <span id="woodCnt">0</span>&nbsp;&nbsp;🪨 <span id="stoneCnt">0</span></div>
<div id="clockHud">🌞</div>
<button id="settingsBtn" class="roundBtn">⚙️</button>
<div id="settings" class="panel">
  <h3>НАСТРОЙКИ</h3>
  <div class="setRow">
    <span>Камера</span>
    <div class="segmented">
      <button id="viewFP" class="active">1-е лицо</button>
      <button id="viewTP">3-е лицо</button>
    </div>
  </div>
</div>
<div id="craftPanel" class="panel">
  <h3>КРАФТ</h3>
  <div class="recipe" data-item="foundation"><span><span class="key">1</span>⬜ Фундамент</span><span class="cost">2🪵 2🪨</span></div>
  <div class="recipe" data-item="floor"><span><span class="key">2</span>🟫 Перекрытие</span><span class="cost">4🪵</span></div>
  <div class="recipe" data-item="stairs"><span><span class="key">3</span>🪜 Лестница</span><span class="cost">3🪵</span></div>
  <div class="recipe" data-item="woodwall"><span><span class="key">4</span>🧱 Дер. стена</span><span class="cost">5🪵</span></div>
  <div class="recipe" data-item="stonewall"><span><span class="key">5</span>🗿 Кам. стена</span><span class="cost">5🪨</span></div>
  <div class="recipe" data-item="window"><span><span class="key">6</span>🪟 Окно</span><span class="cost">4🪵</span></div>
  <div class="recipe" data-item="door"><span><span class="key">7</span>🚪 Дверь</span><span class="cost">4🪵</span></div>
  <div class="recipe" data-item="campfire"><span><span class="key">8</span>🔥 Костёр</span><span class="cost">3🪵 2🪨</span></div>
</div>
<div id="placeControls">
  <button id="placeOk">✓</button>
  <button id="placeCancel">✕</button>
</div>
<div id="hint"></div>
<div id="joystick"><div id="stick"></div></div>
<button id="actionBtn" class="roundBtn">🪓</button>
<button id="craftBtn" class="roundBtn">🔨</button>
<button id="jumpBtn" class="roundBtn">JUMP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ БАЗА ============
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87b5d9, 60, 220);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

// ============ СВЕТ ============
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x3f5a36, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d9, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 400;
scene.add(sun);
scene.add(sun.target);

const moon = new THREE.DirectionalLight(0x8fa8d9, 0);
scene.add(moon);
scene.add(moon.target);

const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(6, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xffe9b0, fog: false })
);
scene.add(sunDisc);
const moonDisc = new THREE.Mesh(
  new THREE.SphereGeometry(4, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xdfe8ff, fog: false })
);
scene.add(moonDisc);

// ============ ЗВЁЗДЫ ============
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 500; i++) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI * 0.5;
  const r = 280;
  starPos.push(
    r * Math.cos(th) * Math.cos(ph),
    r * Math.sin(ph) + 10,
    r * Math.sin(th) * Math.cos(ph)
  );
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0, fog: false, sizeAttenuation: false });
scene.add(new THREE.Points(starGeo, starMat));

// ============ ШУМ ============
function hash(x, z) {
  let h = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function smoothNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi+1, zi);
  const c = hash(xi, zi+1), d = hash(xi+1, zi+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function terrainHeight(x, z) {
  let h = 0;
  h += smoothNoise(x * 0.012, z * 0.012) * 14;
  h += smoothNoise(x * 0.04,  z * 0.04)  * 4;
  h += smoothNoise(x * 0.15,  z * 0.15)  * 0.7;
  return h - 9;
}

const WATER_Y = -5.2;

// ============ ТЕРРЕЙН ============
const T_SIZE = 400, T_SEG = 128;
const terrainGeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, T_SEG, T_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const pos = terrainGeo.attributes.position;
const colors = [];
const cGrass = new THREE.Color(0x5a8f3c);
const cGrass2 = new THREE.Color(0x6da34a);
const cDirt = new THREE.Color(0x8a6f4d);
const cRock = new THREE.Color(0x7d7d78);
const cSand = new THREE.Color(0xc9b280);
const tmpC = new THREE.Color();

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const h = terrainHeight(x, z);
  pos.setY(i, h);
  if (h > 6) tmpC.copy(cRock);
  else if (h > 3.5) tmpC.copy(cDirt).lerp(cRock, (h - 3.5) / 2.5);
  else if (h < WATER_Y + 1.2) tmpC.copy(cSand);
  else {
    const n = smoothNoise(x * 0.08, z * 0.08);
    tmpC.copy(cGrass).lerp(cGrass2, n);
  }
  colors.push(tmpC.r, tmpC.g, tmpC.b);
}
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrain = new THREE.Mesh(
  terrainGeo,
  new THREE.MeshLambertMaterial({ vertexColors: true })
);
terrain.receiveShadow = true;
scene.add(terrain);

// ============ ВОДА ============
const W_SEG = 48;
const waterGeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, W_SEG, W_SEG);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, new THREE.MeshLambertMaterial({
  color: 0x2f6f9f, transparent: true, opacity: 0.72,
}));
water.position.y = WATER_Y;
scene.add(water);
const waterBase = waterGeo.attributes.position.array.slice();

// ============ РЕСУРСЫ: ДЕРЕВЬЯ ============
const dummy = new THREE.Object3D();
const ZERO_M = new THREE.Matrix4().makeScale(0, 0, 0);

const trunkGeo = new THREE.CylinderGeometry(0.18, 0.28, 1.6, 5);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2f });
const crownGeo = new THREE.ConeGeometry(1.3, 2.6, 6);
const crownMat = new THREE.MeshLambertMaterial({ color: 0x2f6b2f });
const crown2Geo = new THREE.ConeGeometry(1.0, 2.0, 6);
const crown2Mat = new THREE.MeshLambertMaterial({ color: 0x3a7d38 });

const TREES = 260;
const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, TREES);
const crowns = new THREE.InstancedMesh(crownGeo, crownMat, TREES);
const crowns2 = new THREE.InstancedMesh(crown2Geo, crown2Mat, TREES);
trunks.castShadow = crowns.castShadow = crowns2.castShadow = true;

const trees = [];

function setTreeMatrices(t, scaleMul = 1) {
  dummy.rotation.set(0, t.rotY, 0);
  dummy.scale.setScalar(t.s * scaleMul);

  dummy.position.set(t.x, t.h + 0.8 * t.s, t.z);
  dummy.updateMatrix();
  trunks.setMatrixAt(t.idx, dummy.matrix);

  dummy.position.set(t.x, t.h + 2.7 * t.s, t.z);
  dummy.updateMatrix();
  crowns.setMatrixAt(t.idx, dummy.matrix);

  dummy.position.set(t.x, t.h + 3.8 * t.s, t.z);
  dummy.updateMatrix();
  crowns2.setMatrixAt(t.idx, dummy.matrix);
}
function hideTree(t) {
  trunks.setMatrixAt(t.idx, ZERO_M);
  crowns.setMatrixAt(t.idx, ZERO_M);
  crowns2.setMatrixAt(t.idx, ZERO_M);
}
function treesNeedUpdate() {
  trunks.instanceMatrix.needsUpdate = true;
  crowns.instanceMatrix.needsUpdate = true;
  crowns2.instanceMatrix.needsUpdate = true;
}

let placedT = 0, guard = 0;
while (placedT < TREES && guard < 6000) {
  guard++;
  const x = (hash(guard, 7) - 0.5) * (T_SIZE - 30);
  const z = (hash(guard, 13) - 0.5) * (T_SIZE - 30);
  const h = terrainHeight(x, z);
  if (h > 3 || h < WATER_Y + 0.6) continue;
  if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
  const t = {
    x, z, h,
    s: 0.8 + hash(guard, 21) * 0.9,
    rotY: hash(guard, 33) * Math.PI * 2,
    idx: placedT,
    hp: 3, alive: true, respawnAt: 0,
  };
  setTreeMatrices(t);
  trees.push(t);
  placedT++;
}
treesNeedUpdate();
scene.add(trunks, crowns, crowns2);

// ============ РЕСУРСЫ: КАМНИ ============
const rockGeo = new THREE.DodecahedronGeometry(0.7, 0);
const rockMat = new THREE.MeshLambertMaterial({ color: 0x8c8c85, flatShading: true });
const ROCKS = 90;
const rocksMesh = new THREE.InstancedMesh(rockGeo, rockMat, ROCKS);
rocksMesh.castShadow = true;

const rocks = [];

function setRockMatrix(r, scaleMul = 1) {
  dummy.position.set(r.x, r.h + r.s * 0.2, r.z);
  dummy.scale.set(r.s * scaleMul, r.sy * scaleMul, r.s * scaleMul);
  dummy.rotation.set(r.rx, r.ry, r.rz);
  dummy.updateMatrix();
  rocksMesh.setMatrixAt(r.idx, dummy.matrix);
}

for (let i = 0; i < ROCKS; i++) {
  const x = (hash(i, 101) - 0.5) * (T_SIZE - 20);
  const z = (hash(i, 202) - 0.5) * (T_SIZE - 20);
  const h = terrainHeight(x, z);
  const s = 0.4 + hash(i, 303) * 1.4;
  const r = {
    x, z, h, s,
    sy: s * (0.6 + hash(i, 404) * 0.6),
    rx: hash(i,505)*3, ry: hash(i,606)*3, rz: hash(i,707)*3,
    idx: i, hp: 4, alive: true, respawnAt: 0,
  };
  setRockMatrix(r);
  rocks.push(r);
}
rocksMesh.instanceMatrix.needsUpdate = true;
scene.add(rocksMesh);

// ============ ОБЛАКА ============
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
const cloudGroup = new THREE.Group();
for (let i = 0; i < 14; i++) {
  const c = new THREE.Group();
  const n = 3 + Math.floor(hash(i, 55) * 3);
  for (let j = 0; j < n; j++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(3 + hash(i*10+j, 66) * 3, 7, 5), cloudMat);
    puff.position.set(j * 4 - n * 2, hash(i*10+j, 77) * 1.5, hash(i*10+j, 88) * 3);
    puff.scale.y = 0.55;
    c.add(puff);
  }
  c.position.set((hash(i, 91)-0.5) * 380, 55 + hash(i, 92) * 25, (hash(i, 93)-0.5) * 380);
  c.userData.speed = 0.5 + hash(i, 94);
  cloudGroup.add(c);
}
scene.add(cloudGroup);

// ============ ПЕРСОНАЖ ============
function buildCharacter() {
  const g = new THREE.Group();
  const skin = new THREE.MeshLambertMaterial({ color: 0xe8b98c });
  const shirt = new THREE.MeshLambertMaterial({ color: 0xc44536 });
  const pants = new THREE.MeshLambertMaterial({ color: 0x3a4a6b });
  const hair = new THREE.MeshLambertMaterial({ color: 0x4a3020 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.3), shirt);
  torso.position.y = 1.0;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.36, 0.36), skin);
  head.position.y = 1.55;
  g.add(head);

  const hairMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.14, 0.4), hair);
  hairMesh.position.y = 1.76;
  g.add(hairMesh);

  const armGeo = new THREE.BoxGeometry(0.14, 0.55, 0.14);
  armGeo.translate(0, -0.22, 0);
  const armL = new THREE.Mesh(armGeo, shirt);
  armL.position.set(-0.36, 1.25, 0);
  const armR = new THREE.Mesh(armGeo.clone(), shirt);
  armR.position.set(0.36, 1.25, 0);
  g.add(armL, armR);

  const legGeo = new THREE.BoxGeometry(0.18, 0.65, 0.18);
  legGeo.translate(0, -0.28, 0);
  const legL = new THREE.Mesh(legGeo, pants);
  legL.position.set(-0.15, 0.68, 0);
  const legR = new THREE.Mesh(legGeo.clone(), pants);
  legR.position.set(0.15, 0.68, 0);
  g.add(legL, legR);

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { group: g, armL, armR, legL, legR };
}
const char = buildCharacter();
scene.add(char.group);

// ============ ИГРОК ============
// спавн: ищем сухое ровное место недалеко от центра
function findSpawn() {
  for (let r = 0; r < 180; r += 6) {
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const h = terrainHeight(x, z);
      if (h > WATER_Y + 1.6 && h < 3) return new THREE.Vector3(x, h, z);
    }
  }
  return new THREE.Vector3(0, terrainHeight(0, 0), 0);
}
const player = {
  pos: findSpawn(),
  velY: 0,
  heading: 0,
  camYaw: 0,
  camPitch: 0,
  onGround: true,
  speed: 8,
  walkPhase: 0,
  moving: 0,
};
const GRAV = 26, JUMP = 9.5, CAM_DIST = 5.5, EYE = 1.6;
let firstPerson = true;
let swingT = 0;

// ============ ИНВЕНТАРЬ ============
const inv = { wood: 500, stone: 500 };
const woodCnt = document.getElementById('woodCnt');
const stoneCnt = document.getElementById('stoneCnt');
function updateInv() {
  woodCnt.textContent = inv.wood;
  stoneCnt.textContent = inv.stone;
  refreshRecipes();
}
setTimeout(updateInv, 0); // показать стартовые ресурсы сразу

// ============ КРАФТ ============
const CELL = 2.0;
const F_H = 0.3;                 // толщина перекрытия
const WALL_H = 2.0;
const FOUND_H = WALL_H / 2;      // фундамент — полстены высотой (задел под «устойчивость»)
const STAIR_DROP = WALL_H + F_H; // лестница поднимает на верх перекрытия, без порога
const SNAP_R = 2.2;
// верх платформы: у фундамента своя высота
const topOf = b => b.baseY + (b.type === 'foundation' ? FOUND_H : F_H);

const RECIPES = {
  foundation: { name: 'Фундамент',   cost: { wood: 2, stone: 2 }, hp: 10, radius: 1.0 },
  floor:      { name: 'Перекрытие',  cost: { wood: 4 },           hp: 6,  radius: 1.0 },

const BUILDERS = {
  foundation: buildFoundation, floor: buildFloor, stairs: buildStairs,
  campfire: buildCampfire, woodwall: buildWoodWall, stonewall: buildStoneWall,
  window: buildWindowWall, door: buildDoorWall,
};

// buildings: { type, mesh, x, z, baseY, rotY, hp, maxHp, radius }
const buildings = [];
const isWallType = t => t === 'woodwall' || t === 'stonewall' || t === 'window' || t === 'door';
const isPlatform = b => b.type === 'foundation' || b.type === 'floor';
// сегменты коллизии (вдоль локальной оси); у двери — проём
const WALL_SEGS = {
  woodwall: [[-CELL/2, CELL/2]],
  stonewall: [[-CELL/2, CELL/2]],
  window: [[-CELL/2, CELL/2]],
  door: [[-CELL/2, -0.65], [0.65, CELL/2]],
};
// радиус выталкивания: у двери меньше, чтобы игрок пролезал в проём
const WALL_PUSH = { woodwall: 0.6, stonewall: 0.6, window: 0.6, door: 0.4 };

function canAfford(cost) {
  return (!cost.wood || inv.wood >= cost.wood) && (!cost.stone || inv.stone >= cost.stone);
}
function refreshRecipes() {
  document.querySelectorAll('.recipe').forEach(el => {
    const r = RECIPES[el.dataset.item];
    el.classList.toggle('disabled', !canAfford(r.cost));
  });
}

// ============ ПРИВЯЗКА ============
const ADJ = [[1,0],[-1,0],[0,1],[0,-1]];

function snapOccupied(type, p) {
  for (const b of buildings) {
    const d2 = (p.x-b.x)**2 + (p.z-b.z)**2;
    const dy = Math.abs(p.y - b.baseY);
    if (type === 'foundation' && b.type === 'foundation' && d2 < 1.0) return true;
    if (type === 'floor' && b.type === 'floor' && d2 < 1.0 && dy < 0.5) return true;
    if (isWallType(type) && isWallType(b.type) && d2 < 0.09 && dy < 0.5) return true;
    if (type === 'campfire' && b.type === 'campfire' && d2 < 0.36 && dy < 0.5) return true;
    if (type === 'stairs' && b.type === 'stairs' && d2 < 1.0 && dy < 0.5) return true;
  }
  return false;
}

function computePlacement(type, wx, wz, freeAng) {
  let best = null, bestD = SNAP_R * SNAP_R;
  const consider = (c, bias = 0) => {
    if (snapOccupied(type, c)) return; // занятые точки пропускаем — снап уходит на свободный ярус
    // кандидаты этажей совпадают по XZ — сравниваем по высоте, где «стоят ноги» (c.ref)
    const yPen = (((c.ref ?? c.y) - player.pos.y) / 2.5) ** 2;
    const d2 = (wx-c.x)**2 + (wz-c.z)**2 + yPen - bias;
    if (d2 < bestD) { bestD = d2; best = c; }
  };

  if (type === 'foundation') {
    for (const f of buildings) {
      if (f.type !== 'foundation') continue;
      for (const [ox, oz] of ADJ)
        consider({ x: f.x+ox*CELL, z: f.z+oz*CELL, y: f.baseY, rot: 0, snapped: true });
    }
    return best || { x: wx, z: wz, y: terrainHeight(wx, wz), rot: 0, snapped: false };
  }

  if (type === 'floor') {
    for (const p of buildings) {
      if (!isPlatform(p)) continue;
      // над платформой — потолок / пол второго этажа (стоишь внизу на платформе)
      consider({ x: p.x, z: p.z, y: topOf(p) + WALL_H, rot: 0, snapped: true, ref: topOf(p) });
      // вбок от других перекрытий на той же высоте (стоишь на перекрытии)
      if (p.type === 'floor')
        for (const [ox, oz] of ADJ)
          consider({ x: p.x+ox*CELL, z: p.z+oz*CELL, y: p.baseY, rot: 0, snapped: true, ref: topOf(p) });
    }
    return best || { x: wx, z: wz, y: 0, rot: 0, snapped: false, invalid: true };
  }

  if (isWallType(type)) {
    for (const p of buildings) {
      if (!isPlatform(p)) continue;
      const top = topOf(p);
      consider({ x: p.x, z: p.z + CELL/2, y: top, rot: 0, snapped: true });
      consider({ x: p.x, z: p.z - CELL/2, y: top, rot: 0, snapped: true });
      consider({ x: p.x + CELL/2, z: p.z, y: top, rot: Math.PI/2, snapped: true });
      consider({ x: p.x - CELL/2, z: p.z, y: top, rot: Math.PI/2, snapped: true });
    }
    // поверх существующей стены — второй ярус (на уровне перекрытий, чтобы этажи совпадали)
    for (const w of buildings) {
      if (!isWallType(w.type)) continue;
      consider({ x: w.x, z: w.z, y: w.baseY + WALL_H + F_H, rot: w.rotY, snapped: true });
    }
    return best || { x: wx, z: wz, y: terrainHeight(wx, wz), rot: freeAng + Math.PI/2, snapped: false };
  }

  if (type === 'stairs') {
    // направление спуска — к игроку (поднимаешься вперёд), квантуем по осям
    const ddx = -Math.sin(freeAng), ddz = -Math.cos(freeAng);
    let inRot;
    if (Math.abs(ddx) > Math.abs(ddz)) inRot = ddx > 0 ? 0 : Math.PI;
    else inRot = ddz > 0 ? -Math.PI/2 : Math.PI/2;

    for (const p of buildings) {
      if (!isPlatform(p)) continue;
      const top = topOf(p);
      // внутри ячейки: с платформы на верх этажа выше (стоишь у её низа)
      consider({ x: p.x, z: p.z, y: top + WALL_H + F_H, rot: inRot, snapped: true, ref: top }, 0.01);
      // снаружи: спуск с платформы на землю (стоишь внизу)
      consider({ x: p.x + CELL, z: p.z, y: top, rot: 0,          snapped: true, ref: top - STAIR_DROP });
      consider({ x: p.x - CELL, z: p.z, y: top, rot: Math.PI,    snapped: true, ref: top - STAIR_DROP });
      consider({ x: p.x, z: p.z + CELL, y: top, rot: -Math.PI/2, snapped: true, ref: top - STAIR_DROP });
      consider({ x: p.x, z: p.z - CELL, y: top, rot: Math.PI/2,  snapped: true, ref: top - STAIR_DROP });
    }
    return best || { x: wx, z: wz, y: 0, rot: 0, snapped: false, invalid: true };
  }

  // костёр — к центру платформы
  for (const p of buildings) {
    if (!isPlatform(p)) continue;
    consider({ x: p.x, z: p.z, y: topOf(p), rot: freeAng, snapped: true });
  }
  return best || { x: wx, z: wz, y: terrainHeight(wx, wz), rot: freeAng, snapped: false };
}

function placementValid(type, p) {
  if (p.invalid) return false;
  const B = T_SIZE / 2 - 5;
  if (Math.abs(p.x) > B || Math.abs(p.z) > B) return false;

  if (p.snapped) return !snapOccupied(type, p);

  const r = RECIPES[type].radius;
  for (const t of trees) {
    if (!t.alive) continue;
    if ((p.x-t.x)**2 + (p.z-t.z)**2 < (r + 0.5*t.s)**2) return false;
  }
  for (const rk of rocks) {
    if (!rk.alive) continue;
    if ((p.x-rk.x)**2 + (p.z-rk.z)**2 < (r + rk.s*0.7)**2) return false;
  }
  for (const b of buildings) {
    if ((p.x-b.x)**2 + (p.z-b.z)**2 < (r + b.radius)**2) return false;
  }
  return true;
}

// --- размещение с призраком ---
let placing = null;
const placeControls = document.getElementById('placeControls');
const placeOk = document.getElementById('placeOk');
const craftPanel = document.getElementById('craftPanel');

function startPlacing(type) {
  cancelPlacing();
  const ghost = BUILDERS[type]();
  ghost.traverse(o => {
    if (o.isMesh) {
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.45;
    }
    if (o.isPointLight) o.intensity = 0;
  });
  scene.add(ghost);
  placing = { type, ghost };
  placeControls.classList.add('visible');
  craftPanel.classList.remove('open');
}
function cancelPlacing() {
  if (placing) {
    scene.remove(placing.ghost);
    placing = null;
  }
  placeControls.classList.remove('visible');
  hint.classList.remove('visible');
}
function desiredSpot() {
  const fwdAng = firstPerson ? player.camYaw + Math.PI : player.heading;
  return {
    x: player.pos.x + Math.sin(fwdAng) * 3,
    z: player.pos.z + Math.cos(fwdAng) * 3,
    ang: fwdAng,
  };
}
function confirmPlacing() {
  if (!placing) return;
  const d = desiredSpot();
  const p = computePlacement(placing.type, d.x, d.z, d.ang);
  if (!placementValid(placing.type, p)) return;
  const rec = RECIPES[placing.type];
  if (!canAfford(rec.cost)) { cancelPlacing(); return; }
  inv.wood -= rec.cost.wood || 0;
  inv.stone -= rec.cost.stone || 0;

  const mesh = BUILDERS[placing.type]();
  mesh.position.set(p.x, p.y, p.z);
  mesh.rotation.y = p.rot;
  mesh.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(mesh);
  buildings.push({
    type: placing.type, mesh,
    x: p.x, z: p.z, baseY: p.y, rotY: p.rot,
    hp: rec.hp, maxHp: rec.hp, radius: rec.radius,
  });

  updateInv();
  // остаёмся в режиме стройки, пока хватает ресурсов (выход — ✕ / Esc / C)
  if (!canAfford(rec.cost)) cancelPlacing();
}

document.querySelectorAll('.recipe').forEach(el => {
  el.addEventListener('click', () => {
    const type = el.dataset.item;
    if (canAfford(RECIPES[type].cost)) startPlacing(type);
  });
});
function toggleCraftPanel() {
  if (placing) { cancelPlacing(); return; }
  refreshRecipes();
  const opening = !craftPanel.classList.contains('open');
  craftPanel.classList.toggle('open');
  if (opening) document.exitPointerLock?.(); // вернуть курсор для выбора
}
document.getElementById('craftBtn').addEventListener('click', toggleCraftPanel);
placeOk.addEventListener('click', confirmPlacing);
document.getElementById('placeCancel').addEventListener('click', cancelPlacing);

// ============ СБОР / УДАРЫ ============
const GATHER_R = 3.2;
const RESPAWN_MS = 40000;
let target = null;
const actionBtn = document.getElementById('actionBtn');
const hint = document.getElementById('hint');

function findTarget() {
  let best = null, bestD = GATHER_R * GATHER_R;
  for (const t of trees) {
    if (!t.alive) continue;
    const d2 = (player.pos.x-t.x)**2 + (player.pos.z-t.z)**2;
    if (d2 < bestD) { bestD = d2; best = { kind: 'tree', obj: t }; }
  }
  for (const r of rocks) {
    if (!r.alive) continue;
    const d2 = (player.pos.x-r.x)**2 + (player.pos.z-r.z)**2;
    if (d2 < bestD) { bestD = d2; best = { kind: 'rock', obj: r }; }
  }
  return best;
}

function hitTarget() {
  if (!target) return;
  const o = target.obj;
  o.hp--;
  swingT = 0.3;

  if (target.kind === 'tree') {
    if (o.hp <= 0) {
      o.alive = false;
      o.respawnAt = performance.now() + RESPAWN_MS;
      hideTree(o);
      inv.wood += 3;
    } else {
      setTreeMatrices(o, 1.08);
      setTimeout(() => { if (o.alive) { setTreeMatrices(o); treesNeedUpdate(); } }, 120);
      inv.wood += 1;
    }
    treesNeedUpdate();
  } else if (target.kind === 'rock') {
    if (o.hp <= 0) {
      o.alive = false;
      o.respawnAt = performance.now() + RESPAWN_MS;
      rocksMesh.setMatrixAt(o.idx, ZERO_M);
      inv.stone += 2;
    } else {
      setRockMatrix(o, 1.08);
      setTimeout(() => { if (o.alive) { setRockMatrix(o); rocksMesh.instanceMatrix.needsUpdate = true; } }, 120);
      inv.stone += 1;
    }
    rocksMesh.instanceMatrix.needsUpdate = true;
  }
  updateInv();
}

function processRespawns(now) {
  let tDirty = false, rDirty = false;
  for (const t of trees) {
    if (!t.alive && now >= t.respawnAt) {
      t.alive = true; t.hp = 3;
      setTreeMatrices(t);
      tDirty = true;
    }
  }
  for (const r of rocks) {
    if (!r.alive && now >= r.respawnAt) {
      r.alive = true; r.hp = 4;
      setRockMatrix(r);
      rDirty = true;
    }
  }
  if (tDirty) treesNeedUpdate();
  if (rDirty) rocksMesh.instanceMatrix.needsUpdate = true;
}

// ============ УПРАВЛЕНИЕ ============
const joy = { id: null, x: 0, y: 0 };
const look = { id: null, lastX: 0, lastY: 0 };
const joyEl = document.getElementById('joystick');
const stickEl = document.getElementById('stick');
const JOY_R = 44;

function joyCenter() {
  const r = joyEl.getBoundingClientRect();
  return { cx: r.left + r.width/2, cy: r.top + r.height/2 };
}
function setStick(dx, dy) {
  stickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function handleJoy(t) {
  const { cx, cy } = joyCenter();
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; }
  joy.x = dx / JOY_R;
  joy.y = dy / JOY_R;
  setStick(dx, dy);
}

function pitchClamp() {
  return firstPerson ? [-1.35, 1.35] : [-0.2, 1.2];
}

addEventListener('touchstart', e => {
  if (e.target.closest('.panel') || e.target.closest('button') || e.target.closest('#placeControls')) return;
  for (const t of e.changedTouches) {
    const jr = joyEl.getBoundingClientRect();
    const inJoy = t.clientX > jr.left - 30 && t.clientX < jr.right + 30 &&
                  t.clientY > jr.top - 30 && t.clientY < jr.bottom + 30;
    if (inJoy && joy.id === null) {
      joy.id = t.identifier;
      handleJoy(t);
    } else if (t.clientX > innerWidth * 0.4 && look.id === null) {
      look.id = t.identifier;
      look.lastX = t.clientX; look.lastY = t.clientY;
    }
  }
}, { passive: false });

addEventListener('touchmove', e => {
  let handled = false;
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { handleJoy(t); handled = true; }
    else if (t.identifier === look.id) {
      const [lo, hi] = pitchClamp();
      player.camYaw   -= (t.clientX - look.lastX) * 0.006;
      player.camPitch += (t.clientY - look.lastY) * 0.005;
      player.camPitch = Math.max(lo, Math.min(hi, player.camPitch));
      look.lastX = t.clientX; look.lastY = t.clientY;
      handled = true;
    }
  }
  if (handled) e.preventDefault();
}, { passive: false });

addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      joy.id = null; joy.x = joy.y = 0;
      setStick(0, 0);
    }
    if (t.identifier === look.id) look.id = null;
  }
});

document.getElementById('jumpBtn').addEventListener('touchstart', e => {
  e.stopPropagation();
  if (player.onGround) { player.velY = JUMP; player.onGround = false; }
}, { passive: true });

actionBtn.addEventListener('touchstart', e => {
  e.stopPropagation();
  hitTarget();
}, { passive: true });
actionBtn.addEventListener('click', e => {
  if (e.detail !== 0) hitTarget();
});

// Настройки
const settingsPanel = document.getElementById('settings');
document.getElementById('settingsBtn').addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
  if (settingsPanel.classList.contains('open')) document.exitPointerLock?.();
});
const viewFP = document.getElementById('viewFP');
const viewTP = document.getElementById('viewTP');
function setView(fp) {
  firstPerson = fp;
  viewFP.classList.toggle('active', fp);
  viewTP.classList.toggle('active', !fp);
  char.group.visible = !fp;
  document.getElementById('crosshair').style.display = fp ? 'block' : 'none';
  const [lo, hi] = pitchClamp();
  player.camPitch = Math.max(lo, Math.min(hi, player.camPitch));
  if (!fp) player.camPitch = Math.max(0.15, player.camPitch);
}
viewFP.addEventListener('click', () => setView(true));
viewTP.addEventListener('click', () => setView(false));
setView(true);

// Десктоп
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && player.onGround) { player.velY = JUMP; player.onGround = false; }
  if (e.code === 'KeyE') hitTarget();
  if (e.code === 'KeyV') setView(!firstPerson);
  if (e.code === 'KeyC') toggleCraftPanel();
  if (e.code === 'Enter' && placing) confirmPlacing();
  if (e.code === 'Escape') { cancelPlacing(); craftPanel.classList.remove('open'); }
  // хоткеи рецептов 1-8 — работают даже при захваченной мыши
  if (e.code.startsWith('Digit')) {
    const n = parseInt(e.code.slice(5)) - 1;
    if (n >= 0 && n < HOTKEYS.length) {
      const type = HOTKEYS[n];
      if (canAfford(RECIPES[type].cost)) startPlacing(type);
    }
  }
});
addEventListener('keyup', e => keys[e.code] = false);
renderer.domElement.addEventListener('click', () => {
  // клик при захваченной мыши во время стройки = поставить
  if (placing && document.pointerLockElement === renderer.domElement) {
    confirmPlacing();
    return;
  }
  renderer.domElement.requestPointerLock?.();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    const [lo, hi] = pitchClamp();
    player.camYaw   -= e.movementX * 0.0025;
    player.camPitch += e.movementY * 0.0025;
    player.camPitch = Math.max(lo, Math.min(hi, player.camPitch));
  }
});

// ============ ДЕНЬ/НОЧЬ ============
const DAY_LEN = 120;
let dayTime = DAY_LEN * 0.25;

const skyDay = new THREE.Color(0x87b5d9);
const skySunset = new THREE.Color(0xe8926b);
const skyNight = new THREE.Color(0x0b1026);
const skyColor = new THREE.Color();
const clockHud = document.getElementById('clockHud');

function updateDayNight(dt) {
  dayTime = (dayTime + dt) % DAY_LEN;
  const ang = (dayTime / DAY_LEN) * Math.PI * 2;
  const sunH = Math.sin(ang);

  const R = 260;
  sunDisc.position.set(
    player.pos.x + Math.cos(ang) * R,
    Math.sin(ang) * R * 0.6,
    player.pos.z + Math.sin(ang * 0.3) * 40 - 80
  );
  moonDisc.position.set(
    player.pos.x - Math.cos(ang) * R,
    -Math.sin(ang) * R * 0.6,
    player.pos.z + 80
  );

  sun.position.copy(sunDisc.position).sub(player.pos).setLength(120).add(player.pos);
  sun.position.y = Math.max(sun.position.y, 5);
  sun.target.position.copy(player.pos);
  moon.position.copy(moonDisc.position).sub(player.pos).setLength(120).add(player.pos);
  moon.position.y = Math.max(moon.position.y, 5);
  moon.target.position.copy(player.pos);

  const dayF = THREE.MathUtils.clamp(sunH * 2.2, 0, 1);
  const nightF = THREE.MathUtils.clamp(-sunH * 2.2, 0, 1);
  const sunsetF = THREE.MathUtils.clamp(1 - Math.abs(sunH) * 3.5, 0, 1);

  sun.intensity = dayF * 1.1;
  sun.castShadow = dayF > 0.05;
  moon.intensity = nightF * 0.25;
  hemi.intensity = 0.18 + dayF * 0.7;

  skyColor.copy(skyNight).lerp(skyDay, dayF);
  skyColor.lerp(skySunset, sunsetF * 0.8);
  scene.background = skyColor;
  scene.fog.color.copy(skyColor);

  starMat.opacity = nightF;
  cloudMat.opacity = 0.15 + dayF * 0.7;
  sunDisc.visible = sunH > -0.15;
  moonDisc.visible = sunH < 0.15;

  const hours = Math.floor(((dayTime / DAY_LEN) * 24 + 6) % 24);
  const icon = sunH > 0.3 ? '🌞' : sunH > -0.1 ? '🌅' : '🌙';
  clockHud.textContent = `${icon} ${String(hours).padStart(2,'0')}:00`;
}

// ============ ЦИКЛ ============
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();

function angleLerp(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const now = performance.now();

  // ввод
  let mx = joy.x, mz = joy.y;
  if (keys['KeyW']) mz -= 1;
  if (keys['KeyS']) mz += 1;
  if (keys['KeyA']) mx -= 1;
  if (keys['KeyD']) mx += 1;
  let ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; ml = 1; }
  player.moving = ml;

  if (ml > 0.05) {
    const moveAng = Math.atan2(mx, mz) + player.camYaw;
    if (!firstPerson) {
      player.heading = angleLerp(player.heading, moveAng, Math.min(1, dt * 12));
    }
    const inWater = player.pos.y < WATER_Y - 0.3;
    const spd = player.speed * ml * (inWater ? 0.45 : 1);
    player.pos.x += Math.sin(moveAng) * spd * dt;
    player.pos.z += Math.cos(moveAng) * spd * dt;
    player.walkPhase += dt * (inWater ? 5 : 9) * ml;
  }
  if (firstPerson) player.heading = player.camYaw + Math.PI;

  // границы
  const B = T_SIZE / 2 - 5;
  player.pos.x = Math.max(-B, Math.min(B, player.pos.x));
  player.pos.z = Math.max(-B, Math.min(B, player.pos.z));

  // коллизия с деревьями
  for (const tp of trees) {
    if (!tp.alive) continue;
    const dx = player.pos.x - tp.x, dz = player.pos.z - tp.z;
    const d2 = dx*dx + dz*dz;
    const min = 0.5 * tp.s + 0.35;
    if (d2 < min * min && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      player.pos.x = tp.x + dx / d * min;
      player.pos.z = tp.z + dz / d * min;
    }
  }
  // коллизия с постройками
  for (const b of buildings) {
    if (isPlatform(b)) continue; // по плитам ходим
    if (b.type === 'stairs') {
      // если игрок ниже поверхности марша — лестница твёрдая, выталкиваем
      const dirX = Math.cos(b.rotY), dirZ = -Math.sin(b.rotY);
      const perpX = Math.sin(b.rotY), perpZ = Math.cos(b.rotY);
      const relX = player.pos.x - b.x, relZ = player.pos.z - b.z;
      const lu = relX * dirX + relZ * dirZ;
      const lv = relX * perpX + relZ * perpZ;
      const HU = CELL/2 + 0.2, HV = 0.8;
      if (Math.abs(lu) < HU && Math.abs(lv) < HV) {
        const luC = Math.max(-CELL/2, Math.min(CELL/2, lu));
        const stepIdx = Math.min(5, Math.max(0, Math.floor((luC + CELL/2) / (CELL/6))));
        const h = b.baseY - stepIdx / 6 * STAIR_DROP;
        if (player.pos.y < h - 0.55) {
          const cands = [
            { pen: HU - lu, dx: dirX,  dz: dirZ  },
            { pen: lu + HU, dx: -dirX, dz: -dirZ },
            { pen: HV - lv, dx: perpX, dz: perpZ },
            { pen: lv + HV, dx: -perpX, dz: -perpZ },
          ];
          let bc = cands[0];
          for (const c of cands) if (c.pen < bc.pen) bc = c;
          player.pos.x += bc.dx * bc.pen;
          player.pos.z += bc.dz * bc.pen;
        }
      }
      continue;
    }
    if (isWallType(b.type)) {
      // держат только на уровне игрока (второй этаж не мешает первому)
      if (player.pos.y >= b.baseY + WALL_H - 0.1 || player.pos.y < b.baseY - 1.0) continue;
      const dirX = Math.cos(b.rotY), dirZ = -Math.sin(b.rotY);
      const relX = player.pos.x - b.x, relZ = player.pos.z - b.z;
      const proj = relX * dirX + relZ * dirZ;
      for (const [a, bb] of WALL_SEGS[b.type]) {
        const tt = Math.max(a, Math.min(bb, proj));
        const cpX = b.x + dirX * tt, cpZ = b.z + dirZ * tt;
        const dx = player.pos.x - cpX, dz = player.pos.z - cpZ;
        const d2 = dx*dx + dz*dz;
        const min = WALL_PUSH[b.type];
        if (d2 < min * min && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          player.pos.x = cpX + dx / d * min;
          player.pos.z = cpZ + dz / d * min;
        }
      }
    } else {
      const dx = player.pos.x - b.x, dz = player.pos.z - b.z;
      const d2 = dx*dx + dz*dz;
      const min = b.radius + 0.35;
      if (d2 < min * min && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        player.pos.x = b.x + dx / d * min;
        player.pos.z = b.z + dz / d * min;
      }
    }
  }

  // гравитация + земля (платформы и лестницы — тоже пол)
  const prevY = player.pos.y;
  player.velY -= GRAV * dt;
  player.pos.y += player.velY * dt;
  let ground = terrainHeight(player.pos.x, player.pos.z);
  const STEP_UP = 0.45; // максимальный «шаг» вверх — прыжком под потолок уже не затянет
  for (const b of buildings) {
    if (isPlatform(b)) {
      if (Math.abs(player.pos.x - b.x) <= CELL/2 + 0.1 &&
          Math.abs(player.pos.z - b.z) <= CELL/2 + 0.1) {
        const top = topOf(b);
        if (prevY >= top - STEP_UP) ground = Math.max(ground, top);
      }
    } else if (b.type === 'stairs') {
      const dirX = Math.cos(b.rotY), dirZ = -Math.sin(b.rotY);
      const perpX = Math.sin(b.rotY), perpZ = Math.cos(b.rotY);
      const relX = player.pos.x - b.x, relZ = player.pos.z - b.z;
      const lu = relX * dirX + relZ * dirZ;
      const lv = relX * perpX + relZ * perpZ;
      if (Math.abs(lu) <= CELL/2 && Math.abs(lv) <= 0.7) {
        const stepIdx = Math.min(5, Math.max(0, Math.floor((lu + CELL/2) / (CELL/6))));
        const h = b.baseY - stepIdx / 6 * STAIR_DROP;
        if (prevY >= h - STEP_UP) ground = Math.max(ground, h);
      }
    } else if (isWallType(b.type)) {
      // торец стены — узкая дорожка
      const dirX = Math.cos(b.rotY), dirZ = -Math.sin(b.rotY);
      const relX = player.pos.x - b.x, relZ = player.pos.z - b.z;
      const proj = Math.max(-CELL/2, Math.min(CELL/2, relX * dirX + relZ * dirZ));
      const cpX = b.x + dirX * proj, cpZ = b.z + dirZ * proj;
      const dW = (player.pos.x-cpX)**2 + (player.pos.z-cpZ)**2;
      if (dW < 0.35 * 0.35) {
        const top = b.baseY + WALL_H;
        if (prevY >= top - STEP_UP) ground = Math.max(ground, top);
      }
    }
  }
  if (player.pos.y <= ground) {
    player.pos.y = ground;
    player.velY = 0;
    player.onGround = true;
  }
  // потолок: головой в перекрытие — прыжок гасится
  const HEAD = 1.75;
  if (player.velY > 0) {
    for (const b of buildings) {
      if (!isPlatform(b)) continue;
      if (Math.abs(player.pos.x - b.x) > CELL/2 + 0.1 ||
          Math.abs(player.pos.z - b.z) > CELL/2 + 0.1) continue;
      if (prevY + HEAD <= b.baseY + 0.01 && player.pos.y + HEAD > b.baseY) {
        player.pos.y = b.baseY - HEAD;
        player.velY = 0;
      }
    }
  }

  // персонаж
  char.group.position.copy(player.pos);
  char.group.rotation.y = player.heading;

  const swing = Math.sin(player.walkPhase) * 0.7 * player.moving;
  char.legL.rotation.x = swing;
  char.legR.rotation.x = -swing;
  char.armL.rotation.x = -swing * 0.8;
  char.armR.rotation.x = swing * 0.8;
  if (swingT > 0) {
    swingT -= dt;
    char.armR.rotation.x = -1.6 + Math.sin(swingT * 20) * 0.5;
  }
  if (!player.onGround) {
    char.legL.rotation.x = 0.5;
    char.legR.rotation.x = -0.3;
    char.armL.rotation.x = -0.6;
    char.armR.rotation.x = -0.6;
  }

  // камера
  if (firstPerson) {
    camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.camYaw;
    camera.rotation.x = -player.camPitch;
    camera.rotation.z = 0;
  } else {
    camTarget.set(player.pos.x, player.pos.y + 1.4, player.pos.z);
    camPos.set(
      camTarget.x + Math.sin(player.camYaw) * Math.cos(player.camPitch) * CAM_DIST,
      camTarget.y + Math.sin(player.camPitch) * CAM_DIST,
      camTarget.z + Math.cos(player.camYaw) * Math.cos(player.camPitch) * CAM_DIST
    );
    const camGround = terrainHeight(camPos.x, camPos.z) + 0.5;
    if (camPos.y < camGround) camPos.y = camGround;
    camera.position.lerp(camPos, Math.min(1, dt * 10));
    camera.lookAt(camTarget);
  }

  // призрак размещения
  if (placing) {
    const d = desiredSpot();
    const p = computePlacement(placing.type, d.x, d.z, d.ang);
    placing.ghost.visible = !p.invalid;
    placing.ghost.position.set(p.x, p.y || 0, p.z);
    placing.ghost.rotation.y = p.rot;
    const ok = placementValid(placing.type, p);
    placeOk.disabled = !ok;
    placing.ghost.traverse(o => {
      if (o.isMesh) o.material.color.setHex(ok ? (p.snapped ? 0x7fdc8f : 0xffffff) : 0xff5544);
    });
    if (p.invalid) {
      hint.textContent = 'Нужна платформа рядом (фундамент/перекрытие)';
      hint.classList.add('visible');
    } else if (!target) {
      hint.classList.remove('visible');
    }
  }

  // цель
  target = findTarget();
  if (target && !placing) {
    actionBtn.classList.add('visible');
    if (target.kind === 'tree') {
      actionBtn.textContent = '🪓';
      hint.textContent = `Рубить дерево (${target.obj.hp}/3)`;
    } else {
      actionBtn.textContent = '⛏️';
      hint.textContent = `Добыть камень (${target.obj.hp}/4)`;
    }
    hint.classList.add('visible');
  } else if (!placing) {
    actionBtn.classList.remove('visible');
    hint.classList.remove('visible');
  } else {
    actionBtn.classList.remove('visible');
  }

  processRespawns(now);

  // огонь костров + двери
  for (const b of buildings) {
    if (b.type === 'door') {
      const dx = player.pos.x - b.x, dz = player.pos.z - b.z;
      const near = dx*dx + dz*dz < 4.4 && Math.abs(player.pos.y - b.baseY) < 2.2;
      const ud = b.mesh.userData;
      ud.doorOpen += ((near ? 1 : 0) - ud.doorOpen) * Math.min(1, dt * 6);
      ud.doorPivot.rotation.y = -ud.doorOpen * Math.PI * 0.52;
      continue;
    }
    if (b.type !== 'campfire') continue;
    const fl = b.mesh.userData.flames;
    const s = 0.9 + Math.sin(t * 11 + b.x) * 0.12 + Math.sin(t * 23) * 0.06;
    fl[0].scale.set(s, s, s);
    fl[1].scale.set(2 - s, s, 2 - s);
    b.mesh.userData.light.intensity = 1.0 + Math.sin(t * 13 + b.z) * 0.25;
  }

  // волны
  const wp = waterGeo.attributes.position;
  for (let i = 0; i < wp.count; i++) {
    const bx = waterBase[i * 3], bz = waterBase[i * 3 + 2];
    wp.setY(i, Math.sin(bx * 0.15 + t * 1.4) * 0.12 + Math.cos(bz * 0.12 + t * 1.1) * 0.12);
  }
  wp.needsUpdate = true;

  // облака
  cloudGroup.children.forEach(c => {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 220) c.position.x = -220;
  });

  updateDayNight(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
