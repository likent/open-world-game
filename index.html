<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Open World</title>
<!-- ?v=… — версия ресурсов: меняй при каждом обновлении, чтобы браузер не отдавал старый кеш -->
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<div id="game"></div>
<div id="crosshair"></div>
<div id="hpHud">❤️<div id="hpBar"><div id="hpFill"></div></div></div>
<div id="clockHud">🌞</div>
<button id="settingsBtn" class="roundBtn">⚙️</button>
<div id="settings" class="panel">
  <h3>НАСТРОЙКИ</h3>
  <div class="setRow">
    <span>Камера</span>
    <div class="segmented">
      <button id="viewFP" class="active">1-е лицо</button>
      <button id="viewTP">3-е лицо</button>
    </div>
  </div>
</div>
<div id="craftPanel" class="panel">
  <button class="panelClose" aria-label="Закрыть">✕</button>
  <h3>КРАФТ</h3>
  <div class="recipe" data-item="foundation"><span><span class="key">1</span>⬜ Фундамент</span><span class="cost">2🪵 2🪨</span></div>
  <div class="recipe" data-item="floor"><span><span class="key">2</span>🟫 Перекрытие</span><span class="cost">4🪵</span></div>
  <div class="recipe" data-item="stairs"><span><span class="key">3</span>🪜 Лестница</span><span class="cost">3🪵</span></div>
  <div class="recipe" data-item="woodwall"><span><span class="key">4</span>🧱 Дер. стена</span><span class="cost">5🪵</span></div>
  <div class="recipe" data-item="stonewall"><span><span class="key">5</span>🗿 Кам. стена</span><span class="cost">5🪨</span></div>
  <div class="recipe" data-item="window"><span><span class="key">6</span>🪟 Окно</span><span class="cost">4🪵</span></div>
  <div class="recipe" data-item="door"><span><span class="key">7</span>🚪 Дверь</span><span class="cost">4🪵</span></div>
  <div class="recipe" data-item="campfire"><span><span class="key">8</span>🔥 Костёр</span><span class="cost">3🪵 2🪨</span></div>
</div>
<div id="inventory" class="panel">
  <button class="panelClose" aria-label="Закрыть">✕</button>
  <h3>РЮКЗАК</h3>
  <div id="invGrid"></div>
  <div id="invHint">Тащи — разложить · Удерживай — описание · Тап по 🍎🥩 — съесть</div>
</div>
<div id="placeControls">
  <button id="placeOk">✓</button>
  <button id="placeCancel">✕</button>
</div>
<div id="hint"></div>
<div id="belt"></div>
<div id="joystick"><div id="stick"></div></div>
<button id="actionBtn" class="roundBtn">🪓</button>
<button id="invBtn" class="roundBtn">🎒</button>
<button id="craftBtn" class="roundBtn">🔨</button>
<button id="jumpBtn" class="roundBtn">JUMP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Игра разбита по модулям; подключаются по порядку — они делят общую глобальную область -->
<script src="js/scene.js?v=9"></script>
<script src="js/noise.js?v=9"></script>
<script src="js/terrain.js?v=9"></script>
<script src="js/resources.js?v=9"></script>
<script src="js/character.js?v=9"></script>
<script src="js/player.js?v=9"></script>
<script src="js/inventory.js?v=9"></script>
<script src="js/belt.js?v=9"></script>
<script src="js/building.js?v=9"></script>
<script src="js/gather.js?v=9"></script>
<script src="js/mobs.js?v=9"></script>
<script src="js/controls.js?v=9"></script>
<script src="js/daynight.js?v=9"></script>
<script src="js/main.js?v=9"></script>
</body>
</html>
